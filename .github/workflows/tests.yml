# Runs on every push and pull request: the unit tests (no models needed), the
# browser audio checks, and the checker that ties every published number to results/.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install what the tests import
        run: python -m pip install numpy==2.5.3 scipy==1.17.0 soundfile==0.13.1 jiwer==4.0.0
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Browser audio checks
        run: node tests/test_audio.cjs
      - name: Numbers on the site, README and paper match results/
        run: python site/tools/check_evidence.py --release
